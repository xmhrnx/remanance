# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/xmhrnx/giode-cli#giodetoml

[app]
name = "DataDoc"
id = "io.github.mehran9675.datadoc"
version = "0.1.0"
build = 1
icon = "assets/icon.png"
# The launch screen in the dark palette's background, which the app
# always starts in, so it opens without a white flash.
splash_color = "#0A0B0F"
package = "./cmd/datadoc"
platforms = ["windows", "macos", "linux", "android", "ios"]
publisher = "xmhrnx"
description = "Free, open-source data recovery: deleted files, formatted drives and lost partitions"
website = "https://xmhrnx.github.io/remanance/"

[android]
min_sdk = 21
# Google Play requires Android 16 (API 36) for new apps and updates since
# 31 Aug 2026; the CLI's default is 35.
target_sdk = 36
# The adaptive icon's layers, drawn by assets/icon/make_icon.py with the
# page inside the middle that every launcher's mask leaves visible.
icon_foreground = "assets/icon/android-foreground.png"
icon_background = "assets/icon/android-background.png"
icon_monochrome = "assets/icon/android-monochrome.png"
# Recovered files go to Download/DataDoc; Android 10 needs the legacy
# storage flag to write there by path.
permissions = ["storage"]
# Scans and recoveries keep going when the app leaves the screen, in
# giode's foreground service, with a notification that brings it back.
keep_alive = true
# enableOnBackInvokedCallback = false: Gio's activity handles Back in
# onBackPressed(), which Android 16 stops calling for apps targeting
# API 36 (predictive back), so the back gesture would close the app.
application_attributes = { requestLegacyExternalStorage = "true", enableOnBackInvokedCallback = "false" }
# The USB and storage bridges, compiled into the APK.
java = ["ui/platform/androidusb", "ui/platform/androidstore"]
# USB drives on an OTG adapter, read through the USB host API. Not
# required, so phones without USB host can still install the app to
# recover from disk images. "All files access" lets DataDoc look
# through the phone's storage for the trash and the copies apps hide;
# the user turns it on in Android's settings when they first scan it.
manifest = '''
<uses-feature android:name="android.hardware.usb.host" android:required="false"/>
<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
'''
# Signs giode build -release (the Play upload key). Kept out of git: the
# release workflow writes it from the ANDROID_KEYSTORE_BASE64 secret, with
# its password in GIODE_KEYSTORE_PASS. giode keystore creates one.
keystore = "release.keystore"

[ios]
min_os = 15
# The icon on its background to the edges: iOS rounds the corners itself
# and would show app.icon's transparent ones white.
icon = "assets/icon/ios.png"
# CI signs device builds with the IOS_CERT_BASE64, IOS_CERT_PASS and
# IOS_PROFILE_BASE64 secrets.

# Recovered files land in the app's Documents folder; these show it in
# the Files app and in Finder when the device is connected.
[ios.plist]
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
# Only standard algorithms (AES and PBKDF2 to open the user's own
# encrypted iPhone backups, SHA-256 to compare files), no proprietary
# ones: no export documentation per upload. See RELEASING.md.
ITSAppUsesNonExemptEncryption = false

[macos]
min_os = 11
# identity = "Developer ID Application: Your Name (TEAMID)"  # signs giode build -release
# notary_id = "you@example.com"
# notary_team_id = "TEAMID"
# There is no Mac App Store build ([macos.store]): the App Sandbox can't
# open /dev/rdisk*, run the administrator prompt, reach usbmuxd for
# iPhones or run adb, so DataDoc couldn't read a single drive or phone
# there. The notarized .dmg is the Mac release. See RELEASING.md.

[macos.plist]
LSApplicationCategoryType = "public.app-category.utilities"
# As on iOS: standard algorithms only (also TLS to a connected iPhone).
ITSAppUsesNonExemptEncryption = false
# What macOS shows when Disk space, Clean up, Duplicates, Rename or a
# folder scan first reads one of these places.
NSDesktopFolderUsageDescription = "DataDoc reads the folders you choose to scan, measure, clean up or rename."
NSDocumentsFolderUsageDescription = "DataDoc reads the folders you choose to scan, measure, clean up or rename."
NSDownloadsFolderUsageDescription = "DataDoc looks through Downloads for old installers and downloads you may not need."
NSRemovableVolumesUsageDescription = "DataDoc reads the USB drives and memory cards you choose to scan or measure."

[windows]
arch = "amd64"

[windows.installer]
# Reading raw drives needs administrator rights; the app asks for them
# when the user opens one, so it installs per user.
desktop_shortcut = true
license = "LICENSE"

# The Microsoft Store package (giode build msix). The Store signs it.
# identity_name must match Partner Center -> DataDoc -> Product identity
# (Package/Identity/Name) once the name is reserved; publisher and
# publisher_display_name are the account's, as for EasySend and AnyFile.
# Raw drives need administrator rights: test "Restart as administrator"
# from the installed MSIX before submitting (RELEASING.md).
[windows.msix]
identity_name = "MehranZahir.DataDoc"
publisher = "CN=B40E8F57-A7E0-40BB-8E74-5D051D0B578B"
publisher_display_name = "Mehran Zahiroddini"

[linux]
categories = ["Utility", "System"]
license = "Apache-2.0"

# The privacy manifest (PrivacyInfo.xcprivacy) for Apple's stores.
# DataDoc sends nothing anywhere: no account, analytics, ads or crash
# reports, so no [[privacy.collected]].
[privacy]
tracking = false
[privacy.api]
# Clean up shows how full the drive is (statfs).
disk_space = ["85F4.1"]

# Disk images open with the app.
[[file_types]]
name = "Disk image"
extensions = ["img", "dd", "raw", "iso", "bin"]
role = "viewer"

# Release builds run when a GitHub release is published, after the
# engine's tests pass on disk images made with each file system's own
# tools.
# giode ci -f writes .github/workflows/release.yml from this. After
# regenerating, redo two edits by hand: pin the CLI with
# `go install github.com/xmhrnx/giode-cli/cmd/giode@v0.1.35-alpha.1`
# (not @latest) and use `go-version-file: go.mod` (not go-version: stable).
[ci]
trigger = "release"
# Keeps the Actions tab's "Run workflow" button.
dispatch = true
test = 'docker run --rm --privileged -v "$PWD/testdata:/t" debian:bookworm sh /t/mkimages.sh && go vet ./engine/... ./cmd/datadoc-cli/... && go test ./engine/... ./ui/platform/...'
