# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/xmhrnx/giode-cli#giodetoml

[app]
name = "DataDoc"
id = "io.github.mehran9675.datadoc"
version = "0.1.0"
build = 1
icon = "assets/icon.png"
package = "./cmd/datadoc"
platforms = ["windows", "macos", "linux", "android", "ios"]
publisher = "xmhrnx"
description = "Free, open-source data recovery: deleted files, formatted drives and lost partitions"
website = "https://github.com/xmhrnx/remanance"

[android]
min_sdk = 21
# The adaptive icon's layers, drawn by assets/icon/make_icon.py with the
# page inside the middle that every launcher's mask leaves visible.
icon_foreground = "assets/icon/android-foreground.png"
icon_background = "assets/icon/android-background.png"
icon_monochrome = "assets/icon/android-monochrome.png"
# Recovered files go to Download/DataDoc; Android 10 needs the legacy
# storage flag to write there by path.
permissions = ["storage"]
# Scans and recoveries keep going when the app leaves the screen, in
# giode's foreground service, with a notification that brings it back.
keep_alive = true
application_attributes = { requestLegacyExternalStorage = "true" }
# The USB and storage bridges, compiled into the APK.
java = ["ui/platform/androidusb", "ui/platform/androidstore"]
# USB drives on an OTG adapter, read through the USB host API. Not
# required, so phones without USB host can still install the app to
# recover from disk images. "All files access" lets DataDoc look
# through the phone's storage for the trash and the copies apps hide;
# the user turns it on in Android's settings when they first scan it.
manifest = '''
<uses-feature android:name="android.hardware.usb.host" android:required="false"/>
<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
'''
# keystore = "release.keystore"   # created by giode keystore; signs giode build -release

[ios]
min_os = 15
# CI signs device builds with the IOS_CERT_BASE64, IOS_CERT_PASS and
# IOS_PROFILE_BASE64 secrets.

# Recovered files land in the app's Documents folder; these show it in
# the Files app and in Finder when the device is connected.
[ios.plist]
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true

[macos]
min_os = 11
# identity = "Developer ID Application: Your Name (TEAMID)"  # signs giode build -release
# notary_id = "you@example.com"
# notary_team_id = "TEAMID"

[windows]
arch = "amd64"

[windows.installer]
# Reading raw drives needs administrator rights; the app asks for them
# when the user opens one, so it installs per user.
desktop_shortcut = true
license = "LICENSE"

[windows.msix]
# Must match the subject of the certificate that signs the package.
publisher = "CN=xmhrnx"

[linux]
categories = ["Utility", "System"]
license = "Apache-2.0"

# Disk images open with the app.
[[file_types]]
name = "Disk image"
extensions = ["img", "dd", "raw", "iso", "bin"]
role = "viewer"

# Release builds run when a GitHub release is published, after the
# engine's tests pass on disk images made with each file system's own
# tools.
[ci]
trigger = "release"
# The Android SDK on GitHub's runners has no bundletool, which the .aab
# build needs; giode looks for it in the newest build-tools.
setup.linux = 'sudo curl -fsSL -o "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/bundletool-all-1.18.3.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar'
test = 'docker run --rm --privileged -v "$PWD/testdata:/t" debian:bookworm sh /t/mkimages.sh && go vet ./engine/... ./cmd/datadoc-cli/... && go test ./engine/... ./ui/platform/...'
